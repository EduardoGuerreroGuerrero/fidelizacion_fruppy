name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Dependency audit (production deps)
        run: npm audit --omit=dev --audit-level=high

  sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply migrations on a scratch Postgres
        run: |
          docker run -d --name pg -e POSTGRES_PASSWORD=ci -p 5432:5432 postgres:16
          until docker exec pg pg_isready -U postgres; do sleep 1; done
          # auth schema stub: organization_members/performed_by referencian auth.users
          # roles anon/authenticated: en Supabase existen; en Postgres plano hay
          # que crearlos (mismo stub que scripts/db_apply.py --stub-auth).
          docker exec -i pg psql -U postgres <<'SQL'
          create schema auth;
          create table auth.users(id uuid primary key);
          do $$ begin
            if not exists (select 1 from pg_roles where rolname='anon') then
              create role anon nologin;
            end if;
            if not exists (select 1 from pg_roles where rolname='authenticated') then
              create role authenticated nologin;
            end if;
          end $$;
          SQL
          for f in supabase/migrations/*.sql; do
            echo "== applying $f"
            docker exec -i pg psql -U postgres -v ON_ERROR_STOP=1 < "$f"
          done
